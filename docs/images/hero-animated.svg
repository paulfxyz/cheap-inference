<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">cheap-inference</title><desc id="d">Animated tokens fall into a funnel; only a few come out the bottom as a small, cheap prompt.</desc>
<style>
.tk{fill:#DA552F;animation:fall 3.6s linear infinite}
.tk.b{fill:#F4EDE4}
@keyframes fall{0%{transform:translateY(-30px);opacity:0}10%{opacity:1}55%{transform:translateY(150px);opacity:1}70%{opacity:.0}100%{opacity:0;transform:translateY(150px)}}
.out{fill:#DA552F;animation:pop 3.6s ease-in-out infinite}
@keyframes pop{0%,55%{opacity:0;transform:translateY(-10px)}70%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(10px)}}
.cnt{animation:blink 1.8s steps(1) infinite}
@keyframes blink{50%{opacity:.55}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.35}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D1814"/><stop offset="1" stop-color="#3a2a22"/></linearGradient></defs>
<rect width="1200" height="400" rx="24" fill="url(#g)"/>
<g font-family="ui-monospace,Menlo,Consolas,monospace" fill="#F4EDE4">
<text x="60" y="110" font-size="54" font-weight="700" font-family="Georgia,serif">cheap-inference</text>
<text x="60" y="158" font-size="22" fill="#DA552F" class="glow">Pay for the tokens that change the answer.</text>
<text x="60" y="215" font-size="16" opacity=".8">0 tokens spent on checks · 0 dependencies · 100 tips</text>
<text x="60" y="242" font-size="16" opacity=".8">42 prompts · 14 chapters · 13 tools</text>
<rect x="60" y="285" width="220" height="44" rx="22" fill="#DA552F"/><text x="170" y="313" font-size="17" text-anchor="middle" fill="#1D1814" font-weight="700">stdlib-only Python</text>
<rect x="296" y="285" width="120" height="44" rx="22" fill="none" stroke="#DA552F" stroke-width="2"/><text x="356" y="313" font-size="17" text-anchor="middle">MIT</text>
</g>
<path d="M 700 120 L 1140 120 L 960 250 L 880 250 Z" fill="#F4EDE4" opacity=".92"/>
<rect x="880" y="250" width="80" height="50" fill="#F4EDE4" opacity=".92"/>
<g>
<circle class="tk" cx="730" cy="40" r="9" style="animation-delay:0s"/><circle class="tk b" cx="780" cy="40" r="9" style="animation-delay:.4s"/>
<circle class="tk" cx="830" cy="40" r="9" style="animation-delay:.8s"/><circle class="tk b" cx="880" cy="40" r="9" style="animation-delay:1.2s"/>
<circle class="tk" cx="930" cy="40" r="9" style="animation-delay:1.6s"/><circle class="tk b" cx="980" cy="40" r="9" style="animation-delay:2s"/>
<circle class="tk" cx="1030" cy="40" r="9" style="animation-delay:2.4s"/><circle class="tk b" cx="1080" cy="40" r="9" style="animation-delay:2.8s"/>
<circle class="tk" cx="1120" cy="40" r="9" style="animation-delay:3.2s"/>
</g>
<g class="out"><circle cx="920" cy="330" r="9"/><circle cx="950" cy="344" r="9"/></g>
<text x="1000" y="352" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#F4EDE4" class="cnt">cheap prompt</text>
</svg>
