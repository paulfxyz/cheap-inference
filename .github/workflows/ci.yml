name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Sample knowledge base lints clean
        run: python tools/kb.py --root examples/sample-kb lint
      - name: Always-loaded files fit the budget
        run: python tools/budget.py examples/budget.json
